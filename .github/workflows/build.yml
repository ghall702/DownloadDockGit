name: Build, test and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (Release)
        run: dotnet build DownloadDock.sln -c Release

      - name: Core tests
        run: dotnet test tests/DownloadDock.Core.Tests -c Release --no-build --logger "trx;LogFileName=core.trx" --logger "console;verbosity=normal" --results-directory artifacts/test-results

      - name: Integration library tests (protocol, pipes, ACLs, reconnects)
        if: success() || failure()
        run: dotnet test tests/DownloadDock.Integration.Tests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=normal" --results-directory artifacts/test-results

      - name: Windows tests (PDFium, WIC, Shell, OLE drag-and-drop, fan window)
        if: success() || failure()
        env:
          DD_SAMPLE_OUT: ${{ github.workspace }}\artifacts\sample-downloads
        run: dotnet test tests/DownloadDock.Windows.Tests -c Release --no-build --logger "trx;LogFileName=windows.trx" --logger "console;verbosity=normal" --results-directory artifacts/test-results

      - name: Show DownloadDock log
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'DownloadDock\log.txt'
          if (Test-Path $log) { Get-Content $log -Tail 150 } else { 'no log' }

      - name: Publish self-contained win-x64 executable
        if: success() || failure()
        run: >
          dotnet publish src/DownloadDock/DownloadDock.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o artifacts/publish

      - name: Pack DownloadDock.Integration (NuGet package for Finder for Windows)
        if: success() || failure()
        run: dotnet pack src/DownloadDock.Integration/DownloadDock.Integration.csproj -c Release -o artifacts/nuget

      - name: Smoke-test the published exe (thumbnails + fan snapshots)
        if: success() || failure()
        shell: pwsh
        run: ./scripts/snapshot.ps1 -Exe artifacts/publish/DownloadDock.exe -Samples artifacts/sample-downloads -Out artifacts/snapshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DownloadDock-win-x64
          path: artifacts/publish/DownloadDock.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DownloadDock.Integration-nupkg
          path: artifacts/nuget/*.nupkg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-snapshots
          path: |
            artifacts/test-results
            artifacts/snapshots
